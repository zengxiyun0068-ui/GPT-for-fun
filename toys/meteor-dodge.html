<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteor Dodge</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05050b;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;top:14px;left:14px;pointer-events:none;text-shadow:0 1px 5px #000}button{pointer-events:auto;border:0;border-radius:999px;padding:8px 12px;font-weight:700}</style></head><body><canvas id="c"></canvas><div id="ui"><b>☄️ Meteor Dodge</b><div id="score">Move the little dot. Don't get hit.</div><button onclick="restart()">restart</button></div><script>const c=document.querySelector('#c'),g=c.getContext('2d');let d,W,H,p,rocks,score,running,last=0;function size(){d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function restart(){p={x:W/2,y:H-80,r:9};rocks=[];score=0;running=true}function add(){rocks.push({x:Math.random()*W,y:-30,r:8+Math.random()*18,v:2+Math.random()*4,dx:(Math.random()-.5)*1.5})}function loop(t){let dt=Math.min(32,t-last);last=t;if(running){if(Math.random()<.025) add();for(const r of rocks){r.y+=r.v*dt/16;r.x+=r.dx*dt/16}rocks=rocks.filter(r=>r.y<H+50);for(const r of rocks){if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+p.r){running=false}}score+=dt/1000}g.fillStyle='rgba(5,5,11,.22)';g.fillRect(0,0,W,H);for(const r of rocks){g.fillStyle='#aaa';g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill()}g.fillStyle=running?'#fff':'#f66';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();document.querySelector('#score').textContent=running?'Score: '+score.toFixed(1):'💥 You got bonked after '+score.toFixed(1)+'s';requestAnimationFrame(loop)}c.addEventListener('pointermove',e=>{if(running)p.x=Math.max(10,Math.min(W-10,e.clientX));p.y=Math.max(40,Math.min(H-10,e.clientY))});restart();requestAnimationFrame(loop);</script></body></html>
