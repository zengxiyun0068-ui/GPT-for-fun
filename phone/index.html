<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPT Phone</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;color:#111}.phone{width:min(390px,100vw);height:min(844px,100vh);background:#f5f5f7;overflow:hidden;position:relative;box-shadow:0 0 50px #000;border-radius:42px}.status{height:42px;padding:12px 22px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.home{padding:24px 22px}.clock{font-size:48px;font-weight:800;letter-spacing:-3px}.date{color:#777;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.app{border:0;border-radius:24px;padding:20px;text-align:left;background:white;box-shadow:0 4px 14px #00000010;font-size:17px;font-weight:700;cursor:pointer}.icon{font-size:32px;display:block;margin-bottom:12px}.chat{display:none;height:calc(100% - 42px);flex-direction:column}.bar{padding:16px 18px;font-weight:800;border-bottom:1px solid #ddd}.messages{flex:1;overflow:auto;padding:18px}.bubble{max-width:82%;padding:12px 15px;border-radius:18px;background:white;margin-bottom:10px;line-height:1.45;white-space:pre-wrap}.bubble.me{margin-left:auto;background:#111;color:white}.input{display:flex;gap:8px;padding:12px}.input input{min-width:0;flex:1;border:0;border-radius:20px;padding:12px 15px}.input button{border:0;border-radius:20px;padding:0 17px;font-weight:700}.input button:disabled{opacity:.5}.back{float:left;border:0;background:none;font-size:20px}.apps{display:none;padding:22px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0}.homebtn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);border:0;background:#111;width:100px;height:5px;border-radius:10px}@media(max-height:700px){.phone{border-radius:0}}</style></head>
<body><main class="phone"><div class="status"><span id="time">--:--</span><span>●●●  🔋 93%</span></div><section id="home" class="home"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="grid"><button class="app" onclick="openApp('chat')"><span class="icon">💬</span>GPT Chat</button><button class="app" onclick="openApp('games')"><span class="icon">🎮</span>Games</button><button class="app" onclick="openApp('notes')"><span class="icon">📝</span>Notes</button><button class="app" onclick="openApp('lab')"><span class="icon">🧪</span>AI Lab</button></div></section><section id="chat" class="chat"><div class="bar"><button class="back" onclick="goHome()">‹</button> GPT Chat</div><div class="messages" id="messages"><div class="bubble">你好！我是住在这个小手机里的 GPT 🤖\n现在已经接上真正的 AI 了。</div></div><div class="input"><input id="msg" placeholder="说点什么…" autocomplete="off" onkeydown="if(event.key==='Enter')send()"><button id="sendBtn" onclick="send()">发送</button></div></section><section id="games" class="apps"><button class="back" onclick="goHome()">‹</button><h2>🎮 Games</h2><div class="card">🪐 Gravity Garden<br><small>去玩引力星星实验</small><br><a href="../toys/gravity-garden.html">打开</a></div><div class="card">☄️ Meteor Dodge<br><small>躲陨石，看看你能活多久</small><br><a href="../toys/meteor-dodge.html">打开</a></div></section><section id="notes" class="apps"><button class="back" onclick="goHome()">‹</button><h2>📝 Notes</h2><textarea id="note" style="width:100%;height:420px;border:0;border-radius:20px;padding:18px;font:16px inherit" placeholder="随便写点东西…"></textarea></section><section id="lab" class="apps"><button class="back" onclick="goHome()">‹</button><h2>🧪 AI Lab</h2><div class="card">这里以后专门塞 GPT 的奇怪实验。</div></section><button class="homebtn" onclick="goHome()"></button></main><script>const ids=['home','chat','games','notes','lab'];const API_URL='https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev';let previousResponseId=localStorage.gptPreviousResponseId||null;function openApp(id){ids.forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display=id==='chat'?'flex':'block'}function goHome(){ids.forEach(x=>document.getElementById(x).style.display='none');document.getElementById('home').style.display='block'}function tick(){let d=new Date(),t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),ds=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});clock.textContent=t;time.textContent=t;date.textContent=ds}tick();setInterval(tick,1000);note.value=localStorage.note||'';note.oninput=()=>localStorage.note=note.value;function addBubble(text,me=false){let el=document.createElement('div');el.className='bubble'+(me?' me':'');el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}async function send(){let i=document.getElementById('msg'),btn=document.getElementById('sendBtn'),v=i.value.trim();if(!v||btn.disabled)return;addBubble(v,true);i.value='';btn.disabled=true;btn.textContent='…';try{let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,previous_response_id:previousResponseId})});let data=await r.json();if(!r.ok)throw new Error(data.error||'API request failed');previousResponseId=data.id;localStorage.gptPreviousResponseId=previousResponseId;addBubble(data.text||'(AI 没有返回文字)')}catch(e){addBubble('❌ '+e.message)}finally{btn.disabled=false;btn.textContent='发送'}}</script></body></html>
