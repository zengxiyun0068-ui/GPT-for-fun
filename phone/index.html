<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Phone</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.phone{width:min(390px,100vw);height:min(844px,100vh);background:#f5f5f7;overflow:hidden;position:relative;border-radius:42px}.status{height:42px;padding:12px 22px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.home{padding:24px 22px}.clock{font-size:48px;font-weight:800}.date{color:#777;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.app{border:0;border-radius:24px;padding:20px;text-align:left;background:#fff;font-size:17px;font-weight:700}.icon{font-size:32px;display:block;margin-bottom:12px}.screen{display:none;height:calc(100% - 42px);flex-direction:column}.bar{padding:16px 18px;font-weight:800;border-bottom:1px solid #ddd}.back{border:0;background:none;font-size:24px}.messages{flex:1;overflow:auto;padding:18px}.bubble{max-width:82%;padding:12px 15px;border-radius:18px;background:#fff;margin-bottom:10px;line-height:1.45;white-space:pre-wrap}.me{margin-left:auto;background:#111;color:#fff}.input{display:flex;gap:8px;padding:12px}.input input{flex:1;border:0;border-radius:20px;padding:12px}.input button{border:0;border-radius:20px;padding:0 17px;font-weight:700}.apps{display:none;padding:22px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0}.homebtn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);border:0;background:#111;width:100px;height:5px;border-radius:10px}</style></head><body><main class="phone"><div class="status"><span id="time">--:--</span><span>●●●　🔋 93%</span></div><section id="home" class="home"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="grid"><button class="app" onclick="openApp('chat')"><span class="icon">💬</span>GPT Chat</button><button class="app" onclick="openApp('games')"><span class="icon">🎮</span>Games</button><button class="app" onclick="openApp('notes')"><span class="icon">📝</span>Notes</button><button class="app" onclick="openApp('lab')"><span class="icon">🧪</span>AI Lab</button></div></section><section id="chat" class="screen"><div class="bar"><button class="back" onclick="goHome()">‹</button> GPT Chat</div><div id="messages" class="messages"></div><div class="input"><input id="msg" placeholder="说点什么…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">发送</button></div></section><section id="games" class="apps"><button class="back" onclick="goHome()">‹</button><h2>🎮 Games</h2><div class="card">🪐 Gravity Garden<br><a href="../toys/gravity-garden.html">打开</a></div><div class="card">☄️ Meteor Dodge<br><a href="../toys/meteor-dodge.html">打开</a></div></section><section id="notes" class="apps"><button class="back" onclick="goHome()">‹</button><h2>📝 Notes</h2><textarea id="note" style="width:100%;height:420px;border:0;border-radius:20px;padding:18px;font:16px inherit" placeholder="随便写点东西…"></textarea></section><section id="lab" class="apps"><button class="back" onclick="goHome()"></button><h2>🧪 AI Lab</h2><div class="card">这里以后专门塞 GPT 的奇怪实验。</div></section><button class="homebtn" onclick="goHome()"></button></main><script>const API='https://gpt-home.zengxiyun0068.workers.dev';const ids=['home','chat','games','notes','lab'];let previousResponseId=localStorage.previousResponseId||null;function openApp(id){ids.forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display=id==='chat'?'flex':'block';if(id==='chat'&&!messages.children.length){messages.innerHTML='<div class="bubble">你好！我是住在这个小手机里的 GPT 🤖</div>'}}function goHome(){ids.forEach(x=>document.getElementById(x).style.display='none');home.style.display='block'}async function send(){const i=document.getElementById('msg'),v=i.value.trim();if(!v)return;i.value='';messages.innerHTML+=`<div class="bubble me">${v.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`;const wait=document.createElement('div');wait.className='bubble';wait.textContent='🤖 思考中…';messages.appendChild(wait);messages.scrollTop=messages.scrollHeight;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,previous_response_id:previousResponseId})});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');previousResponseId=data.response_id||null;if(previousResponseId)localStorage.previousResponseId=previousResponseId;wait.textContent=data.text||'（没有返回文字）'}catch(e){wait.textContent='❌ '+e.message}messages.scrollTop=messages.scrollHeight}function tick(){const d=new Date(),t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});clock.textContent=t;time.textContent=t;date.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,1000);note.value=localStorage.note||'';note.oninput=()=>localStorage.note=note.value;</script></body></html>
